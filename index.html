<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>條碼掃描入庫</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 15px; background: #f5f5f7; color: #333; }
    .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h2 { text-align: center; margin-top: 0; color: #007aff; }
    .input-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
    .scan-btn { background: #34c759; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 14px; cursor: pointer; margin-top: 5px; }
    .submit-btn { width: 100%; background: #007aff; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    #reader-wrapper { display: none; margin-bottom: 15px; border: 2px dashed #007aff; border-radius: 8px; overflow: hidden; padding: 10px; }
    #reader { width: 100%; }
    .status { text-align: center; font-weight: bold; font-size: 14px; margin-top: 10px; }
    .close-scan { background: #ff3b30; margin-bottom: 10px; width: 100%; }
  </style>
</head>
<body>

<div class="container">
  <h2>條碼入庫系統</h2>
  
  <div id="reader-wrapper">
    <button class="scan-btn close-scan" onclick="stopScanner()">關閉相機</button>
    <div id="reader"></div>
  </div>

  <div class="input-group">
    <label>工單編號</label>
    <input type="text" id="orderNum" placeholder="請掃描或輸入工單編號">
    <button class="scan-btn" onclick="startScanner('orderNum')">📷 掃描工單</button>
  </div>

  <div class="input-group">
    <label>SKU Number</label>
    <input type="text" id="skuNum" placeholder="請掃描或輸入 SKU">
    <button class="scan-btn" onclick="startScanner('skuNum')">📷 掃描 SKU</button>
  </div>

  <div class="input-group">
    <label>SN (Serial Number)</label>
    <input type="text" id="snNum" placeholder="請掃描或輸入 SN">
    <button class="scan-btn" onclick="startScanner('snNum')">📷 掃描 SN</button>
  </div>

  <div class="input-group">
    <label>數量</label>
    <input type="number" id="quantity" value="1" min="1">
  </div>

  <div class="input-group">
    <label>倉庫號碼</label>
    <input type="text" id="whNum" value="6181">
  </div>

  <button class="submit-btn" onclick="submitToSheet()">確認送出</button>
  <div id="statusText" class="status"></div>
</div>

<script>
  let html5QrcodeScanner = null;
  let currentTargetId = '';

  function startScanner(targetId) {
    currentTargetId = targetId;
    document.getElementById('reader-wrapper').style.display = 'block';
    
    if (html5QrcodeScanner) { html5QrcodeScanner.clear(); }

    html5QrcodeScanner = new Html5Qrcode("reader");
    // 如果你想電腦同電話都順利，我將 facingMode 轉做由系統決定，提高成功率
    html5QrcodeScanner.start(
      { facingMode: "environment" }, 
      { fps: 10, qrbox: { width: 250, height: 150 } },
      function(decodedText) {
        document.getElementById(currentTargetId).value = decodedText;
        stopScanner();
        if (navigator.vibrate) navigator.vibrate(100);
      },
      function(error) { /* 忽略掃描中嘅錯誤 */ }
    ).catch(err => {
      alert("無法啟動相機: " + err);
      console.error(err);
    });
  }

  function stopScanner() {
    if (html5QrcodeScanner) {
      html5QrcodeScanner.stop().then(() => {
        document.getElementById('reader-wrapper').style.display = 'none';
      }).catch(err => console.error(err));
    } else {
      document.getElementById('reader-wrapper').style.display = 'none';
    }
  }

  function submitToSheet() {
    const statusText = document.getElementById('statusText');
    statusText.innerText = "正在儲存...";
    statusText.style.color = "#8e8e93";

    // ！！！請將下面條 Link 換成你 Google Apps Script 嘅 Web App URL ！！！
    const scriptUrl = 'https://script.google.com/macros/s/你嘅部署ID/exec'; 

    const payload = new URLSearchParams({
      orderNum: document.getElementById('orderNum').value.trim(),
      skuNum: document.getElementById('skuNum').value.trim(),
      snNum: document.getElementById('snNum').value.trim(),
      quantity: document.getElementById('quantity').value,
      whNum: document.getElementById('whNum').value.trim()
    });

    fetch(`${scriptUrl}?${payload.toString()}`)
      .then(response => response.json())
      .then(data => {
        if(data.status === "success") {
          statusText.innerText = data.message;
          statusText.style.color = "#34c759";
          document.getElementById('orderNum').value = '';
          document.getElementById('skuNum').value = '';
          document.getElementById('snNum').value = '';
          document.getElementById('quantity').value = '1';
        }
      })
      .catch(error => {
        statusText.innerText = "儲存失敗: " + error;
        statusText.style.color = "#ff3b30";
      });
  }
</script>

</body>
</html>
